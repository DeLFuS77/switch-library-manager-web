# TrueNAS SCALE 24.10 (Electric Eel) or newer: Apps > Discover Apps > ⋮ > Install via YAML,
# name it switch-library-manager-web and paste this file.
# Create the datasets first (e.g. tank/apps/switch-library-manager-web for the data) and set the folder
# of your games below. PUID/PGID 568 is the "apps" user of TrueNAS: give it read and write access to
# both datasets, or use your own user and group. Then open http://<NAS address>:3000
services:
  switch-library-manager-web:
    image: delfus77/switch-library-manager-web:latest
    container_name: switch-library-manager-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Madrid
    volumes:
      # settings, caches, covers and your own prod.keys
      - /mnt/tank/apps/switch-library-manager-web:/usr/local/share/switch-library-manager-web
      # your games
      - /mnt/tank/switch:/mnt/roms
