{{- define "filter"}}
			<form class="toolbar" role="search">
				<div class="toolbar-search">
					<span class="bi bi-search" aria-hidden="true"></span>
					<input type="search" class="form-control" name="q" value="{{.Filter.Keyword}}" placeholder="{{t "Search by name or ID..."}}" aria-label="{{t "Search"}}">
				</div>
				{{- if .Filter.Keyword}}
				<a class="btn btn-link text-decoration-none px-2" href="?per_page={{.Filter.PerPage}}&amp;sort_by={{.Filter.SortBy}}&amp;sort_order={{.Filter.SortOrder}}">{{t "Clear"}}</a>
				{{- end}}
				<label class="visually-hidden" for="sortBy">{{t "Sort by"}}</label>
				<select class="form-select" id="sortBy" name="sort_by" onchange="this.form.submit()">
					{{- if eq .Page "dlc"}}
					<option value="missing"{{if eq .Filter.SortBy "missing"}} selected{{end}}>{{t "# Missing"}}</option>
					{{- end}}
					<option value="name"{{if eq .Filter.SortBy "name"}} selected{{end}}>{{t "Name"}}</option>
					{{- if or (eq .Page "index") (eq .Page "missing") (eq .Page "updates")}}
					<option value="release_date"{{if eq .Filter.SortBy "release_date"}} selected{{end}}>{{t "Release Date"}}</option>
					{{- end}}
					{{- if eq .Page "updates"}}
					<option value="latest_update_date"{{if eq .Filter.SortBy "latest_update_date"}} selected{{end}}>{{t "Latest Update Date"}}</option>
					{{- end}}
					<option value="region"{{if eq .Filter.SortBy "region"}} selected{{end}}>{{t "Region"}}</option>
					{{- if or (eq .Page "index") (eq .Page "updates")}}
					<option value="type"{{if eq .Filter.SortBy "type"}} selected{{end}}>{{t "Type"}}</option>
					{{- end}}
					<option value="id"{{if eq .Filter.SortBy "id"}} selected{{end}}>{{t "ID"}}</option>
				</select>
				<div class="btn-group" role="group" aria-label="{{t "Sort order"}}">
					<input type="radio" class="btn-check" name="sort_order" value="asc" id="ascSortOrder" autocomplete="off" onchange="this.form.submit()"{{if eq .Filter.SortOrder "asc"}} checked{{end}}>
					<label class="btn btn-outline-secondary" for="ascSortOrder" title="{{t "Ascending"}}"><span class="bi bi-sort-down-alt" aria-hidden="true"></span><span class="visually-hidden">{{t "Ascending"}}</span></label>
					<input type="radio" class="btn-check" name="sort_order" value="desc" id="descSortOrder" autocomplete="off" onchange="this.form.submit()"{{if eq .Filter.SortOrder "desc"}} checked{{end}}>
					<label class="btn btn-outline-secondary" for="descSortOrder" title="{{t "Descending"}}"><span class="bi bi-sort-up" aria-hidden="true"></span><span class="visually-hidden">{{t "Descending"}}</span></label>
				</div>
				<input type="hidden" name="per_page" value="{{.Filter.PerPage}}">
			</form>
{{- end}}
