# Creates the GitHub release for a version tag, using the matching section of
# CHANGELOG.md as release notes. GitHub attaches the source code archives.
name: Release

on:
  push:
    tags:
      # versions only, not the "data" tag of the titles database
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # go:embed needs node_modules and the compiled assets
      - name: Build assets
        run: npm ci && npm run build

      - name: Test
        run: go test ./... ./switchfs/_crypto/

      - name: Extract release notes
        run: |
          # the section between "## <tag>" and the next "## " heading
          awk -v version="${GITHUB_REF_NAME}" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section for ${GITHUB_REF_NAME} in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
