# Creates the GitHub release for a version tag, using the matching section of
# CHANGELOG.md as release notes, with the program for Windows, macOS, Linux and Raspberry Pi
# attached. GitHub attaches the source code archives.
name: Release

on:
  push:
    tags:
      # versions only, not the "data" tag of the titles database
      - '[0-9]+.[0-9]+.[0-9]+'

# nothing by default; the job below gets what it needs
permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # signed provenance of the programs (Sigstore), checked with "gh attestation verify"
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # go:embed needs node_modules and the compiled assets
      - name: Build assets
        run: npm ci && npm run build

      - name: Test
        run: go test ./... ./switchfs/_crypto/

      - name: Extract release notes
        run: |
          # the section between "## <tag>" and the next "## " heading
          awk -v version="${GITHUB_REF_NAME}" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section for ${GITHUB_REF_NAME} in CHANGELOG.md" >&2
            exit 1
          fi

      # the C compiler of the zstd library in C, checked against its SHA-256
      - name: Set up Zig
        run: bash .github/scripts/setup_zig.sh

      - name: Build the programs
        run: bash .github/scripts/build_release.sh "${GITHUB_REF_NAME}"

      # proof that each file was built by this workflow from this tag
      - name: Attest the programs
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz

      # the signed provenance goes with the files of the release too, to check them offline
      - name: Keep the provenance with the release
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/switch-library-manager-web-${GITHUB_REF_NAME}.intoto.jsonl"

      - name: Add how to download
        run: |
          cat >> release-notes.md <<'EOF'

          ### Downloads

          | System | File |
          |---|---|
          | Windows (most PCs) | `windows-x64.zip` |
          | Windows on ARM | `windows-arm64.zip` |
          | macOS with Apple chip (M1 or newer) | `macos-apple.tar.gz` |
          | macOS with Intel chip | `macos-intel.tar.gz` |
          | Linux, PC | `linux-x64.tar.gz` |
          | Linux on ARM 64-bit (Raspberry Pi 4/5 with a 64-bit system) | `linux-arm64.tar.gz` |
          | Raspberry Pi with a 32-bit system | `linux-armv7.tar.gz` |

          Unpack it and run the program: on Windows and macOS the app opens in the browser, on Linux open
          http://localhost:3000. The settings and the library data are kept next to the program. Docker and Unraid
          users update the container instead. `SHA256SUMS.txt` has the checksums of the files, and
          `gh attestation verify <file> -R DeLFuS77/switch-library-manager-web` proves a file was built here.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt dist/*.intoto.jsonl
