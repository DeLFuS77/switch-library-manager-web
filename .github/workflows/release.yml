# Creates the GitHub release for a version tag, using the matching section of
# CHANGELOG.md as release notes and attaching the binaries.
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build assets
        run: npm ci && npx gulp

      - name: Test
        run: go test ./... ./switchfs/_crypto/

      - name: Build binaries
        run: |
          mkdir -p dist
          build() {
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/$3" .
          }
          build linux amd64 switch-library-manager-web-linux-amd64
          build linux arm64 switch-library-manager-web-linux-arm64
          build windows amd64 switch-library-manager-web-windows-amd64.exe
          build darwin amd64 switch-library-manager-web-macos-amd64
          build darwin arm64 switch-library-manager-web-macos-arm64
          cd dist && sha256sum * > checksums.txt

      - name: Extract release notes
        run: |
          # the section between "## <tag>" and the next "## " heading
          awk -v version="${GITHUB_REF_NAME}" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section for ${GITHUB_REF_NAME} in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
