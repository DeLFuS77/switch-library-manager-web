name: Docker Hub description

# keeps the Docker Hub page in sync with the README without publishing a version
on:
  push:
    branches: [master]
    paths:
      - README.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Docker Hub description
        if: env.DOCKERHUB_TOKEN != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: delfus77
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: delfus77/switch-library-manager-web
          short-description: Manage your Nintendo Switch backup library from the browser
          readme-filepath: ./README.md
