name: Docker Hub description

# keeps the Docker Hub page in sync with the README without publishing a version
on:
  push:
    branches: [master]
    paths:
      - README.md
      - docs/screenshots/**
      - .github/scripts/dockerhub_readme.py
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docker Hub shows the README outside the repository: images and links need full URLs
      - name: Prepare the README for Docker Hub
        run: python3 .github/scripts/dockerhub_readme.py README.md README.dockerhub.md

      - name: Update Docker Hub description
        if: env.DOCKERHUB_TOKEN != ''
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: delfus77
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: delfus77/switch-library-manager-web
          short-description: Nintendo Switch library manager in your browser - updates, DLC, stats, NSZ, discovery
          readme-filepath: ./README.dockerhub.md
