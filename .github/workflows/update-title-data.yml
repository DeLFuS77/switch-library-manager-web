# Generates titles.json from blawar/titledb, and versions.json from the versions of blawar/titledb
# and other sources, and publishes them as assets of the rolling "data" release, which is the
# default source of the app (settings.DATA_RELEASE_URL). Each file is published compressed too,
# which the app downloads first, and only when it changed.
# Adapted from https://github.com/trembon/switch-library-manager
name: Update title data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-title-data
  cancel-in-progress: false

# NUT is code of another project, run with its own dependencies: it runs in a job that can
# only read, at a fixed commit, and the job that publishes runs nothing but zstd and the upload
# of the files it made. A change to NUT is taken on purpose, by changing NUT_COMMIT and making
# .github/nut-requirements.txt again for it.
env:
  NUT_COMMIT: b4b9377b5113d00675c40c28b1c218c10ac66838

jobs:
  generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install NUT system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Clone NUT and titledb
        run: |
          git init -q "$GITHUB_WORKSPACE/nut"
          git -C "$GITHUB_WORKSPACE/nut" fetch -q --depth 1 https://github.com/blawar/nut.git "$NUT_COMMIT"
          git -C "$GITHUB_WORKSPACE/nut" checkout -q FETCH_HEAD
          # the titles are data, followed as they change
          git clone --depth 1 https://github.com/blawar/titledb.git "$GITHUB_WORKSPACE/nut/titledb"

      - name: Install NUT Python dependencies
        working-directory: ${{ github.workspace }}/nut
        # the versions of that commit, with their hashes (see .github/nut-requirements.txt)
        run: python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/.github/nut-requirements.txt"

      - name: Generate US English titles and stage data
        working-directory: ${{ github.workspace }}/nut
        run: |
          python nut.py --import-region US --language en
          mkdir -p "$GITHUB_WORKSPACE/generated-data"
          cp titledb/titles.json "$GITHUB_WORKSPACE/generated-data/titles.json"

      # blawar/titledb stops for weeks at times: the versions of other sources are added to its
      # own, and a source that cannot be downloaded is left out this time
      - name: Generate versions
        run: |
          mkdir -p versions-sources
          get() {
            if ! curl -fsSL --retry 3 --max-time 300 -o "versions-sources/$1" "$2"; then
              rm -f "versions-sources/$1"
              echo "::warning::$2 could not be downloaded, its versions are left out"
            fi
          }
          get borntohonk.versions.json https://raw.githubusercontent.com/borntohonk/titledb/master/versions.json
          get nx-versions.txt https://raw.githubusercontent.com/16BitWonder/nx-versions/master/versions.txt
          get nx-changelog.md https://raw.githubusercontent.com/16BitWonder/nx-versions/master/FULL-CHANGELOG.md
          python .github/scripts/merge_versions.py nut/titledb/versions.json generated-data/versions.json \
            --versions versions-sources/borntohonk.versions.json \
            --nx-versions versions-sources/nx-versions.txt --nx-changelog versions-sources/nx-changelog.md

      # names and descriptions for the translated interface languages
      - name: Generate localized titles
        run: |
          python .github/scripts/build_localized_titles.py nut/titledb/ES.es.json generated-data/titles.es.json
          python .github/scripts/build_localized_titles.py nut/titledb/FR.fr.json generated-data/titles.fr.json
          python .github/scripts/build_localized_titles.py nut/titledb/DE.de.json generated-data/titles.de.json
          python .github/scripts/build_localized_titles.py nut/titledb/IT.it.json generated-data/titles.it.json
          # the Brazilian store has the most titles in Portuguese
          python .github/scripts/build_localized_titles.py nut/titledb/BR.pt.json generated-data/titles.pt.json
          # more languages, when titledb has their store
          for pair in nl:NL.nl ru:RU.ru ja:JP.ja ko:KR.ko; do
            lang="${pair%%:*}"
            store="nut/titledb/${pair#*:}.json"
            if [ -f "$store" ]; then
              python .github/scripts/build_localized_titles.py "$store" "generated-data/titles.$lang.json"
            fi
          done
          # Chinese is sold in several stores, each with few titles: all of them together
          if [ -f nut/titledb/CN.zh.json ] || [ -f nut/titledb/HK.zh.json ] || [ -f nut/titledb/TW.zh.json ]; then
            python .github/scripts/build_localized_titles.py nut/titledb/CN.zh.json generated-data/titles.zh.json nut/titledb/HK.zh.json nut/titledb/TW.zh.json
          fi

      # covers of other stores for titles without one in the US store
      - name: Generate cover fallbacks
        run: |
          python .github/scripts/build_cover_fallbacks.py generated-data/titles.json nut/titledb generated-data/titles.covers.json

      # the series of the games, from Wikidata; when Wikidata does not answer, the published
      # file of the last run stays
      - name: Generate series
        continue-on-error: true
        run: python .github/scripts/build_series.py generated-data/titles.series.json

      - name: Validate generated JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for filename in ("titles.json", "versions.json", "titles.es.json", "titles.fr.json", "titles.de.json", "titles.it.json", "titles.pt.json", "titles.covers.json",
                           "titles.nl.json", "titles.ru.json", "titles.ja.json", "titles.ko.json", "titles.zh.json"):
              path = Path("generated-data") / filename
              # the last languages are optional: titledb may not have their store
              if filename in ("titles.nl.json", "titles.ru.json", "titles.ja.json", "titles.ko.json", "titles.zh.json") and not path.exists():
                  continue
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty generated file: {path}")
              with path.open(encoding="utf-8") as source:
                  payload = json.load(source)
              # NUT already fills most missing covers from other stores, so the fallbacks may be empty
              if not isinstance(payload, dict) or (not payload and filename != "titles.covers.json"):
                  raise SystemExit(f"Expected a non-empty JSON object: {path}")

          series = Path("generated-data") / "titles.series.json"
          if series.exists():
              with series.open(encoding="utf-8") as source:
                  payload = json.load(source)
              if not payload.get("series"):
                  series.unlink()
                  print("The series from Wikidata are empty, the published file stays")
          PY

      - name: Keep the generated files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: title-data
          path: generated-data/*.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Get the generated files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: title-data
          path: generated-data

      # only JSON objects are published, whatever the job before left
      - name: Check the files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in Path("generated-data").iterdir():
              if path.suffix != ".json" or not path.name.startswith("titles") and path.name != "versions.json":
                  raise SystemExit(f"Unexpected file: {path}")
              with path.open(encoding="utf-8") as source:
                  if not isinstance(json.load(source), dict):
                      raise SystemExit(f"Expected a JSON object: {path}")
          PY

      # Only the files that changed are published again: the others keep their etag, and the app
      # is told "not modified" instead of downloading them again. data.sha256 lists the files
      # published with their compressed copy (.json.zst); a file leaves it before it is published
      # again, so a run that stops halfway publishes it again the next time.
      - name: Publish data release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: >-
            Rolling `titles.json` in US English, generated from blawar/titledb using blawar/nut;
            `versions.json`, with the versions of blawar/titledb, borntohonk/titledb and 16BitWonder/nx-versions;
            and `titles.<lang>.json` with names and descriptions in Spanish, French, German, Italian, Portuguese,
            Dutch, Russian, Japanese, Korean and Chinese. Every file is also published compressed with zstd
            (`.json.zst`), and `data.sha256` has the SHA-256 of each one.
        run: |
          if ! gh release view data >/dev/null 2>&1; then
            gh release create data \
              --prerelease \
              --latest=false \
              --title "Switch Library Manager title data" \
              --notes "$NOTES"
          elif [ "$(gh release view data --json body --jq .body)" != "$NOTES" ]; then
            gh release edit data --notes "$NOTES"
          fi

          gh release view data --json assets --jq '.assets[].name' > published-names.txt
          if grep -qx data.sha256 published-names.txt; then
            gh release download data --pattern data.sha256 --output published.sha256
          fi
          mkdir -p publishing published
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          names = set(Path("published-names.txt").read_text().split())
          published = {}
          if Path("published.sha256").exists():
              for line in Path("published.sha256").read_text().splitlines():
                  digest, _, name = line.partition("  ")
                  # only a file that is there with its compressed copy
                  if name in names and name + ".zst" in names:
                      published[name] = digest

          current = {path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                     for path in sorted(Path("generated-data").glob("*.json"))}
          changed = [name for name, digest in current.items() if published.get(name) != digest]
          # the files not generated this time (the series when Wikidata did not answer) stay
          kept = {name: digest for name, digest in published.items() if name not in changed}

          def listing(files):
              return "".join(f"{digest}  {name}\n" for name, digest in sorted(files.items()))

          Path("changed.txt").write_text("".join(name + "\n" for name in changed), newline="\n")
          Path("publishing/data.sha256").write_text(listing(kept), newline="\n")
          Path("published/data.sha256").write_text(listing({**kept, **{name: current[name] for name in changed}}), newline="\n")
          print(f"{len(changed)} of {len(current)} files changed: {' '.join(changed) or 'none'}")
          PY

          if [ -s changed.txt ]; then
            gh release upload data publishing/data.sha256 --clobber
            while read -r name; do
              zstd -19 -T0 -q -f "generated-data/$name" -o "generated-data/$name.zst"
              gh release upload data "generated-data/$name.zst" "generated-data/$name" --clobber
            done < changed.txt
            gh release upload data published/data.sha256 --clobber
          fi
