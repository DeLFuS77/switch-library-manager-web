name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem!

        **Never attach or paste `prod.keys`, `title.keys` or any console key**: they are not needed and must not be
        shared. Remove keys from logs and screenshots before posting.

        This tracker is for the official versions of Switch Library Manager Web: the programs of its
        [releases page](https://github.com/DeLFuS77/switch-library-manager-web/releases) and its Docker images on ghcr.io
        and Docker Hub. A build made or changed by someone else is supported by whoever made it: report its problems
        there. A copy you built yourself from this repository is an unofficial build: choose "Built from source" below.
  - type: checkboxes
    id: official
    attributes:
      label: Official version
      options:
        - label: I use an official version (from the releases page, a Docker image of this repository, or updated by the app itself) or a copy I built myself from this repository without changes, not one modified or built by someone else.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of every page, e.g. 1.3.0
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Docker (Docker Hub)
        - Docker (ghcr.io)
        - Binary
        - Built from source (unofficial build)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: e.g. Windows 11, Synology DS920+, Raspberry Pi 4, Ubuntu 24.04
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Set `"debug": true` in settings.json, restart the app, reproduce the problem and paste the log here.
        Check that it contains no keys.
      render: text
  - type: checkboxes
    id: keys
    attributes:
      label: Keys
      options:
        - label: I did not include any console keys in this report
          required: true
